name: Generate Weekly AI Blog

on:
  schedule:
    # Saturday 00:00 UTC = Friday 7 PM ET (EST) / 8 PM ET (EDT)
    - cron: "0 0 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-blog
  cancel-in-progress: false

jobs:
  generate-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Export environment variables
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV
          echo "UNSPLASH_ACCESS_KEY=${{ secrets.UNSPLASH_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "OPENAI_MODEL=gpt-5-pro" >> $GITHUB_ENV

      - name: Generate blog
        run: npx ts-node --project scripts/tsconfig.json scripts/generate_blog.ts

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "🤖 Auto-generate weekly AI blog"
          git push
